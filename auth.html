<!DOCTYPE html>
<!-- version 1.0 -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Авторизация Raymondovich.">
  <title>RAYMONDOVICH — Авторизация</title>
  <link rel="stylesheet" href="./source/design/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand">RAYMONDOVICH</div>
    <section class="auth-panel">
      <h1 class="auth-title" id="auth-title"></h1>
      <p class="auth-subtitle" id="auth-subtitle"></p>
      <form class="auth-form" id="auth-form">
        <div class="auth-field" id="display-name-field" hidden>
          <label for="display-name">Имя</label>
          <input id="display-name" name="display-name" type="text" autocomplete="name">
        </div>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        </div>
        <button class="auth-submit" id="submit-button" type="submit"></button>
      </form>
      <button class="auth-switch" id="switch-button" type="button"></button>
      <div class="auth-message" id="message" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="./source/presentation/auth/auth-page.js"></script>
</body>
</html>
