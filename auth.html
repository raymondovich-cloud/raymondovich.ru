<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#08090b">
  <title>Авторизация — Raymondovich</title>
  <link rel="stylesheet" href="source/design-system/tokens/tokens.css">
  <link rel="stylesheet" href="source/design-system/themes/themes.css">
  <link rel="stylesheet" href="source/design-system/foundations/foundations.css">
  <link rel="stylesheet" href="source/design-system/foundations/motion.css">
  <link rel="stylesheet" href="source/design-system/components/components.css">
  <link rel="stylesheet" href="source/design-system/patterns/public-home.css">
  <link rel="stylesheet" href="source/design-system/patterns/auth.css">
  <script type="module" src="source/presentation/auth/auth.js"></script>
</head>
<body class="ds-public-home ds-auth-page">
  <header class="ds-public-home__header">
    <a class="ds-public-home__brand" href="/">raymondovich</a>
    <a class="ds-button ds-button--secondary" href="/">На главную</a>
  </header>
  <main class="ds-auth-main">
    <section class="ds-auth-card ds-card ds-motion-enter" aria-labelledby="auth-title">
      <div class="ds-auth-heading">
        <span class="ds-badge ds-badge--accent">RAYMONDOVICH ACCOUNT</span>
        <h1 id="auth-title">Добро пожаловать</h1>
        <p id="auth-description">Войдите в своё пространство.</p>
      </div>
      <div class="ds-segmented ds-auth-tabs" role="group" aria-label="Режим авторизации">
        <button class="ds-segmented__item" type="button" data-mode="login" aria-pressed="true">Вход</button>
        <button class="ds-segmented__item" type="button" data-mode="register" aria-pressed="false" disabled aria-disabled="true" title="Регистрация будет открыта после переноса персональных данных">Регистрация</button>
      </div>
      <p class="ds-auth-legal">Публичная регистрация временно закрыта до завершения переноса хранения персональных данных в соответствующую юрисдикцию.</p>

      <form id="login-form" class="ds-auth-form">
        <label class="ds-field">Логин или Email
          <input class="ds-input" name="identifier" type="text" autocomplete="username" required maxlength="254" placeholder="Введите логин или Email">
        </label>
        <label class="ds-field">Пароль
          <input class="ds-input" name="password" type="password" autocomplete="current-password" required minlength="1" maxlength="256" placeholder="Введите пароль">
        </label>
        <button class="ds-button ds-button--large ds-auth-submit" type="submit">Войти</button>
        <button class="ds-button ds-button--ghost" type="button" id="forgot-password">Забыли пароль?</button>
      </form>

      <form id="register-form" class="ds-auth-form" hidden>
        <label class="ds-field">ФИО
          <input class="ds-input" name="full_name" type="text" autocomplete="name" required minlength="3" maxlength="160" placeholder="Фамилия Имя Отчество">
        </label>
        <label class="ds-field">Дата рождения
          <input class="ds-input" name="birth_date" type="date" autocomplete="bday" required>
        </label>
        <label class="ds-field">Логин
          <input class="ds-input" name="username" type="text" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,23}" autocapitalize="none" spellcheck="false" placeholder="Например, raymondovich">
          <small>3–24 символа: латинские буквы, цифры, точка, дефис или подчёркивание.</small>
        </label>
        <label class="ds-field">Email
          <input class="ds-input" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com">
        </label>
        <label class="ds-field">Пароль
          <input class="ds-input" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" placeholder="Не менее 10 символов">
        </label>
        <button class="ds-button ds-button--large ds-auth-submit" type="submit">Создать аккаунт</button>
        <p class="ds-auth-legal">Создавая аккаунт, вы подтверждаете корректность введённых данных.</p>
      </form>
      <div id="auth-status" class="ds-alert" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
</body>
</html>
