<!DOCTYPE html>
<!-- version 1.1 -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://yajybgdorhxebbigwjgi.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Регистрация Raymondovich.">
  <meta name="robots" content="noindex,nofollow">
  <title>RAYMONDOVICH — Регистрация</title>
  <link rel="stylesheet" href="./source/design/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand">RAYMONDOVICH</div>
    <section class="auth-panel">
      <h1 class="auth-title">Создать аккаунт</h1>
      <p class="auth-subtitle">Регистрация пользователя Raymondovich.</p>
      <form class="auth-form" id="registration-form">
        <div class="auth-field">
          <label for="display-name">Имя</label>
          <input id="display-name" name="display-name" type="text" autocomplete="name" required>
        </div>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="auth-submit" type="submit">Зарегистрироваться</button>
      </form>
      <a class="auth-switch" href="./auth.html">У меня уже есть аккаунт</a>
      <div class="auth-message" id="message" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="./source/presentation/auth/register-page.js"></script>
</body>
</html>
