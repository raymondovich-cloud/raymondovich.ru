name: Manual Vite production deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Подтверждаю публикацию production-сборки raymondovich.ru"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Vite artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run application unit tests
        run: npm test

      - name: Build Vite production output
        run: npm run build

      - name: Verify production artifact
        run: npm run test:build

      - name: Install Chromium and WebKit test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish verified artifact to GitHub Pages
    if: github.ref == 'refs/heads/main' && inputs.confirm_production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
