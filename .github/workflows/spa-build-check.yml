name: SPA build verification

on:
  push:
    branches:
      - architecture/spa-rewrite-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spa-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Install dependencies and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application unit tests
        run: npm test

      - name: Build both HTML entry points
        run: npm run build
