name: SPA build verification

on:
  push:
    branches:
      - architecture/spa-rewrite-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spa-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.ref == 'refs/heads/architecture/spa-rewrite-2026-11-05'
    name: Generate and commit dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: lock frontend dependencies"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  build:
    if: github.ref == 'refs/heads/architecture/spa-rewrite-2026-11-05'
    needs: lockfile
    name: Run tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report resolved direct dependencies
        run: npm list --depth=0

      - name: Run application unit tests
        run: npm test

      - name: Build all legacy entry points and SPA
        run: npm run build

      - name: Verify built routes and authentication bridges
        run: npm run test:build

      - name: Install Chromium and WebKit test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser end-to-end tests
        run: npm run test:e2e
