name: SPA build verification

on:
  push:
    branches:
      - architecture/spa-rewrite-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spa-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/architecture/spa-rewrite-2026-11-05'
    name: Run tests, production build and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report resolved direct dependencies
        run: npm list --depth=0

      - name: Run application unit tests
        run: npm test

      - name: Build all legacy entry points and SPA
        run: npm run build

      - name: Verify built routes and authentication bridges
        run: npm run test:build

      - name: Install Chromium and WebKit test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser end-to-end tests
        run: npm run test:e2e
