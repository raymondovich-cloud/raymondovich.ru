# file-version: 1.0
name: Domain tool tests

on:
  pull_request:
  push:

jobs:
  domain-tools:
    name: Test domain tool registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run domain tool tests
        run: node --experimental-default-type=module --test tests/domain/tools/*.test.mjs
