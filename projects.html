<!DOCTYPE html>
<!-- version 2.3 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://yajybgdorhxebbigwjgi.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<title>RAYMONDOVICH — Projects</title>
<link rel="stylesheet" href="./source/design/projects.css?v=2.1">
</head>
<body>
<main class="projects-shell">
<header class="projects-header">
<a class="projects-back" href="./app.html">← Control</a>
<div><p class="project-kicker">PROJECTS</p><h1>Проекты</h1></div>
</header>
<section id="project-list-view">
<section class="project-section"><div class="project-section-header"><div><p class="project-kicker">ACTIVE</p><h2>Мои проекты</h2></div></div><div id="project-list"></div></section>
<div class="project-create" id="create-project-form">
<button class="project-create-toggle" id="create-project-toggle" type="button" aria-expanded="false" aria-controls="create-project-content"><span><p class="project-kicker">NEW PROJECT</p><strong>Добавить проект</strong></span><span class="project-create-chevron" aria-hidden="true">⌄</span></button>
<div class="project-create-content" id="create-project-content" hidden>
<input name="name" required maxlength="120" placeholder="Название проекта">
<textarea name="description" rows="3" placeholder="Идея проекта"></textarea>
<textarea name="goal" rows="3" placeholder="Цель проекта"></textarea>
<textarea name="completionCriteria" rows="8" maxlength="30000" placeholder="Что должно быть правдой при 100%"></textarea>
<section class="ai-create-section">
<div class="project-section-header"><div><p class="project-kicker">AI PROJECT MANAGER</p><h3>Зафиксировать план</h3></div></div>
<p class="project-help">Сформируй детальную карту проекта в ChatGPT и вставь возвращённый JSON. После фиксации проект будет создан с этим планом.</p>
<button class="project-action" id="create-prompt-button" type="button">Сформировать запрос для ChatGPT</button>
<textarea id="create-prompt-output" rows="10" placeholder="Готовый запрос появится здесь..."></textarea>
<textarea id="create-plan-input" rows="12" placeholder="Вставь JSON из ChatGPT..."></textarea>
<button class="project-action primary" id="fix-plan-button" type="button">Зафиксировать план</button>
</section>
<button class="project-action primary" id="create-project-button" type="button">Создать проект</button>
<p class="project-status" id="create-status"></p>
</div>
</div>
</section>
<section id="project-detail-view" hidden>
<button class="projects-back project-detail-back" id="back-button" type="button">← Все проекты</button>
<div id="project-detail"></div>
</section>
</main>
<script type="module" src="./source/presentation/projects/projects-page.js?v=2.3"></script>
<script type="module" src="./source/presentation/projects/create-project.js?v=1.2"></script>
<script type="module" src="./source/presentation/projects/open-created-project.js?v=1.0"></script>
</body>
</html>
