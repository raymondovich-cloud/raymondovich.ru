<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Сброс пароля Raymondovich.">
  <title>RAYMONDOVICH — Сброс пароля</title>
  <link rel="stylesheet" href="./source/design/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand">RAYMONDOVICH</div>
    <section class="auth-panel">
      <h1 class="auth-title">Сбросить пароль</h1>
      <p class="auth-subtitle">Введите email, который использовали при регистрации.</p>
      <form class="auth-form" id="reset-form">
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="auth-submit" type="submit">Отправить письмо</button>
      </form>
      <a class="auth-switch" href="./auth.html">Вернуться к авторизации</a>
      <div class="auth-message" id="message" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="./source/presentation/auth/reset-password-page.js"></script>
</body>
</html>
