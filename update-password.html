<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://yajybgdorhxebbigwjgi.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Изменение пароля Raymondovich.">
  <meta name="robots" content="noindex,nofollow">
  <title>RAYMONDOVICH — Новый пароль</title>
  <link rel="stylesheet" href="./source/design/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand">RAYMONDOVICH</div>
    <section class="auth-panel">
      <h1 class="auth-title">Новый пароль</h1>
      <p class="auth-subtitle">Введите новый пароль для аккаунта Raymondovich.</p>
      <form class="auth-form" id="update-password-form">
        <div class="auth-field">
          <label for="password">Новый пароль</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="auth-field">
          <label for="password-confirmation">Повторите пароль</label>
          <input id="password-confirmation" name="password-confirmation" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="auth-submit" type="submit">Изменить пароль</button>
      </form>
      <div class="auth-message" id="message" aria-live="polite">Проверяем ссылку восстановления.</div>
    </section>
  </main>
  <script type="module" src="./source/presentation/auth/update-password-page.js"></script>
</body>
</html>
