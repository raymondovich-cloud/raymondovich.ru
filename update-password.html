<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light">
  <title>Новый пароль — Raymondovich</title>
  <link rel="stylesheet" href="source/design-system/tokens/tokens.css"><link rel="stylesheet" href="source/design-system/themes/themes.css"><link rel="stylesheet" href="source/design-system/foundations/foundations.css"><link rel="stylesheet" href="source/design-system/components/components.css"><link rel="stylesheet" href="source/design-system/patterns/public-home.css"><link rel="stylesheet" href="source/design-system/patterns/auth.css">
  <script type="module" src="source/presentation/auth/update-password.js"></script>
</head>
<body class="ds-public-home"><header class="ds-public-home__header"><a class="ds-public-home__brand" href="/">raymondovich</a></header>
<main class="ds-auth-main"><section class="ds-auth-card ds-card"><h1>Новый пароль</h1><p>Введите новый пароль для аккаунта.</p>
<form id="password-form" class="ds-auth-form"><label class="ds-field">Новый пароль<input class="ds-input" type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button class="ds-button ds-button--large ds-auth-submit" type="submit">Сохранить пароль</button></form>
<div id="password-status" class="ds-alert" role="status" aria-live="polite" hidden></div></section></main></body></html>
