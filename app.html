<!DOCTYPE html>
<!-- version 2.0 -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://yajybgdorhxebbigwjgi.supabase.co; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'">

  <title>RAYMONDOVICH — Control</title>
  <link rel="stylesheet" href="./source/design/app.css?v=2.0">

<body>
  <main class="control-shell">
    <header class="control-header">
      <div>
        <p class="control-kicker">PRIVATE WORKSPACE</p>
        <h1>Raymondovich Control</h1>
      </div>
      <button class="control-logout" id="logout-button" type="button">Выйти</button>
    </header>
    <section class="control-workspace" aria-label="Рабочее пространство">
      <p class="control-kicker">WORKSPACE</p>
      <p class="control-empty">Рабочее пространство готово к новой архитектуре.</p>
    </section>
    <p class="control-status" id="control-status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./source/presentation/app/app-page.js?v=2.0"></script>
