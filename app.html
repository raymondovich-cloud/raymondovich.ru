<!DOCTYPE html>
<!-- version 4.1 -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://yajybgdorhxebbigwjgi.supabase.co; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Закрытый центр управления экосистемой Raymondovich.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050505">
  <title>RAYMONDOVICH — Control</title>
  <link rel="stylesheet" href="./source/design/app.css?v=4.1">
</head>
<body>
  <div class="app-shell">
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Закрыть меню"></button>
    <aside class="sidebar" id="main-sidebar" aria-label="Боковая навигация">
      <p class="sidebar-label">РАБОЧЕЕ ПРОСТРАНСТВО</p>
      <nav class="main-nav" aria-label="Основная навигация">
        <button class="nav-item is-active" type="button" data-view="overview"><span class="nav-icon" aria-hidden="true">⌂</span><span>Обзор</span></button>
        <button class="nav-item" type="button" data-view="ideas"><span class="nav-icon" aria-hidden="true">✳</span><span>Идеи</span><span class="nav-count" id="ideas-count">0</span></button>
        <button class="nav-item" type="button" data-view="projects"><span class="nav-icon" aria-hidden="true">▦</span><span>Проекты</span><span class="nav-count" id="projects-count">0</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span><span>Личное пространство</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Открыть навигацию" aria-expanded="false"><span></span><span></span><span></span></button>
        <div class="topbar-context"><span class="status-dot"></span>ECOSYSTEM ONLINE</div>
        <div class="topbar-actions">
          <button class="button button-primary" id="open-idea-dialog" type="button"><span aria-hidden="true">＋</span> Новая идея</button>
          <div class="account-wrap">
            <button class="account-trigger" id="account-trigger" type="button" aria-haspopup="true" aria-expanded="false"><span class="account-trigger-name">RAYMONDOVICH</span><span class="account-avatar">R</span></button>
            <section class="account-panel" id="account-panel" aria-label="Личный кабинет" hidden>
              <div class="account-panel-heading"><span class="account-avatar account-avatar-large">R</span><div><strong>Личный кабинет</strong><small id="account-email">Загрузка аккаунта…</small></div></div>
              <button class="account-panel-item" type="button" disabled><span>Почтовый ящик</span><small>СКОРО</small></button>
              <button class="account-panel-item" type="button" disabled><span>Управление аккаунтом</span><small>СКОРО</small></button>
              <div class="account-panel-divider"></div>
              <button class="account-logout" id="logout-button" type="button">↗ <span>Выйти из аккаунта</span></button>
            </section>
          </div>
        </div>
      </header>

      <section class="page-content" id="workspace-content" aria-live="polite">
        <div class="loading-state">Подключаем рабочее пространство…</div>
      </section>
      <p class="app-status" id="control-status" role="status" aria-live="polite"></p>
      <footer class="app-footer">RAYMONDOVICH DIGITAL ECOSYSTEM <span>·</span> PRIVATE WORKSPACE</footer>
    </main>
  </div>

  <dialog class="idea-dialog" id="idea-dialog">
    <form id="idea-form" class="idea-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">БЫСТРАЯ ФИКСАЦИЯ</p><h2>Новая идея</h2></div>
        <button class="icon-button" id="close-idea-dialog" type="button" aria-label="Закрыть">×</button>
      </div>
      <label class="field-label" for="idea-title">О чём идея?</label>
      <input id="idea-title" name="title" type="text" maxlength="120" placeholder="Коротко запиши мысль…" autocomplete="off" required>
      <label class="field-label" for="idea-description">Дополнение <span>необязательно</span></label>
      <textarea id="idea-description" name="description" rows="3" maxlength="3000" placeholder="Контекст, детали или просто голосом позже…"></textarea>
      <div class="dialog-actions">
        <button class="button button-quiet" id="cancel-idea" type="button">Отмена</button>
        <button class="button button-primary" id="save-idea" type="submit">Сохранить идею</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./source/presentation/app/app-page.js?v=4.1"></script>
</body>
</html>
