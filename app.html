<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#08090b">
  <title>Рабочее пространство — Raymondovich</title>
  <link rel="stylesheet" href="source/design-system/tokens/tokens.css">
  <link rel="stylesheet" href="source/design-system/themes/themes.css">
  <link rel="stylesheet" href="source/design-system/foundations/foundations.css">
  <link rel="stylesheet" href="source/design-system/foundations/motion.css">
  <link rel="stylesheet" href="source/design-system/components/components.css">
  <link rel="stylesheet" href="source/design-system/patterns/public-home.css">
  <link rel="stylesheet" href="source/design-system/patterns/workspace.css">
  <script type="module" src="source/presentation/workspace/workspace.js"></script>
</head>
<body class="ds-workspace">
  <header class="ds-workspace__header">
    <a class="ds-public-home__brand" href="/" aria-label="Raymondovich — главная">raymondovich</a>
    <button class="ds-button ds-button--secondary ds-workspace__logout" id="sign-out" type="button">Выйти</button>
  </header>

  <main class="ds-workspace__main" id="workspace-main">
    <section class="ds-workspace__view ds-motion-enter" aria-labelledby="workspace-title">
      <h1 class="ds-workspace__title" id="workspace-title">Проекты</h1>
      <div class="ds-workspace__content" id="workspace-placeholder"><p class="ds-workspace__placeholder">Раздел пока в разработке.</p></div>
    </section>
  </main>

  <nav class="ds-workspace-nav ds-glass" aria-label="Основная навигация">
    <button class="ds-workspace-nav__item" type="button" data-section="projects" aria-current="page" aria-label="Проекты">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h4"></path></svg>
      <span>Проекты</span>
    </button>
    <button class="ds-workspace-nav__item" type="button" data-section="ideas" aria-label="Идеи">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8.2 14.8a7 7 0 1 1 7.6 0c-.9.6-1.3 1.3-1.4 2.2h-4.8c-.1-.9-.5-1.6-1.4-2.2Z"></path><path d="M12 6v3M8.5 9.5l1.3 1.3M15.5 9.5l-1.3 1.3"></path></svg>
      <span>Идеи</span>
    </button>
    <button class="ds-workspace-nav__item" type="button" data-section="team" aria-label="Команда">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19v-1.2A4.8 4.8 0 0 1 8.3 13h1.4a4.8 4.8 0 0 1 4.8 4.8V19Z"></path><path d="M16 5.3a3 3 0 0 1 0 5.8M17 13.4a4.5 4.5 0 0 1 3.5 4.4V19h-3"></path></svg>
      <span>Команда</span>
    </button>
    <button class="ds-workspace-nav__item" type="button" data-section="tools" aria-label="Инструменты">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6.5 3-3a5 5 0 0 1-6.2 6.2l-7.1 7.1a2.1 2.1 0 0 0 3 3l7.1-7.1a5 5 0 0 0 6.2-6.2l-3 3-3-3Z"></path></svg>
      <span>Инстру<wbr>менты</span>
    </button>
    <button class="ds-workspace-nav__item" type="button" data-section="profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
      <span>Профиль</span>
    </button>
  </nav>
</body>
</html>
