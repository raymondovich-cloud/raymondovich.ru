<!doctype html>
<html lang="ru">
  <head>
    <!-- Version: 1.3.5 -->
    <!-- Updated: 2026-11-16 -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f4f2">
    <meta name="description" content="Raymondovich — цифровая экосистема.">
    <title>Raymondovich</title>
    <link rel="stylesheet" href="/source/design-sistem/public.css">
    <link rel="stylesheet" href="/source/design-sistem/authentication.css?v=1.0.3">
    <link rel="stylesheet" href="/source/design-sistem/workspace.css?v=1.15.0">
    <script type="module" src="/source/design-sistem/public.js"></script>
    <script type="module" src="/source/module/workspace/workspace.js"></script>
    <script type="module" src="/source/module/authentication/authentication.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="header-identity">
          <button class="page-back" type="button" data-page-back aria-label="Вернуться назад" title="Назад">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5m7 7-7-7 7-7"></path>
            </svg>
          </button>
          <a class="brand" href="/" aria-label="Raymondovich — главная">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>raymondovich</span>
          </a>
        </div>

        <nav class="header-actions public-header-actions" data-public-actions aria-label="Основные действия">
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Переключить тему"
            title="Переключить тему"
          >
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
            </svg>
          </button>
          <a class="login-link" href="/#login">Войти</a>
        </nav>
        <nav class="header-actions workspace-header-actions" data-workspace-actions aria-label="Инструменты рабочего пространства" hidden>
          <button class="workspace-icon-button" type="button" aria-label="Уведомления" title="Уведомления" data-workspace-notifications><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg></button>
          <button class="workspace-icon-button" type="button" aria-label="Поиск" title="Поиск" data-workspace-search><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button>
        </nav>
      </header>

      <main class="page-main">
        <section class="status-panel" aria-labelledby="status-title">
          <div class="status-indicator">Raymondovich</div>
          <h1 class="status-title" id="status-title">Сайт <span>в разработке</span></h1>
        </section>
        <div data-auth-root hidden></div>
      </main>
    </div>
  </body>
</html>
