<!DOCTYPE html>
<!-- version 1.0 -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RAYMONDOVICH — проекты и продукты.">
  <title>RAYMONDOVICH</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --orange: #ff6a00;
      --orange-soft: #ff9a3d;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 78% 18%, rgba(255, 106, 0, 0.48), transparent 34%),
        radial-gradient(circle at 20% 82%, rgba(255, 106, 0, 0.22), transparent 38%),
        linear-gradient(135deg, #050505 0%, #130a05 45%, #ff6a00 150%);
    }

    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 28px 36px;
    }

    .project-link {
      justify-self: start;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1;
      text-transform: uppercase;
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      opacity: 0.92;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .project-link.developing {
      justify-self: center;
    }

    .project-link:hover,
    .project-link:focus-visible {
      opacity: 1;
      transform: translateY(-1px);
      outline: none;
    }

    .brand {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 80px 24px;
    }

    .brand-title {
      margin: 0;
      text-align: center;
      font-size: clamp(42px, 10vw, 150px);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 0.9;
      text-transform: uppercase;
      text-shadow: 0 12px 60px rgba(0, 0, 0, 0.32);
    }

    @media (max-width: 600px) {
      .site-header {
        padding: 24px 20px;
      }

      .project-link {
        font-size: 10px;
        letter-spacing: 0.11em;
      }

      .brand {
        padding: 72px 20px;
      }

      .brand-title {
        font-size: clamp(38px, 13vw, 72px);
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <button class="project-link" type="button" onclick="showSoon()">
      Действующие проекты
    </button>

    <a class="project-link developing" href="https://lifegame.site/">
      Разрабатываемые проекты
    </a>
  </header>

  <main class="brand">
    <h1 class="brand-title">RAYMONDOVICH</h1>
  </main>

  <script>
    function showSoon() {
      alert("Скоро");
    }
  </script>
</body>
</html>
