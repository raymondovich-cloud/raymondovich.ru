<!doctype html>
<html lang="ru">
  <head>
    <!-- Version: 1.1.0 -->
    <!-- Updated: 2026-11-16 -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f4f2">
    <meta name="description" content="Raymondovich — сайт в разработке.">
    <title>Raymondovich</title>
    <link rel="stylesheet" href="/source/design-sistem/public.css">
    <script type="module" src="/source/design-sistem/public.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Raymondovich — главная">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>raymondovich</span>
        </a>

        <nav class="header-actions" aria-label="Основные действия">
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Переключить тему"
            title="Переключить тему"
          >
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
            </svg>
          </button>
          <a class="login-link" href="/#login">Войти</a>
        </nav>
      </header>

      <main class="page-main">
        <section class="status-panel" aria-labelledby="status-title">
          <div class="status-indicator">Raymondovich</div>
          <h1 class="status-title" id="status-title">Сайт <span>в разработке</span></h1>
        </section>
      </main>
    </div>
  </body>
</html>
