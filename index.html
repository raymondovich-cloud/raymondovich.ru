<!DOCTYPE html>
<!-- version 1.3 -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RAYMONDOVICH — проекты и продукты.">
  <title>RAYMONDOVICH</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 85% 48% at 100% 100%, rgba(255, 106, 0, 0.58), transparent 72%),
        radial-gradient(ellipse 72% 42% at 0% 0%, rgba(255, 106, 0, 0.18), transparent 70%),
        linear-gradient(160deg, #030303 0%, #0b0705 48%, #170a03 76%, #050505 100%);
      background-attachment: fixed;
    }

    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 28px 36px;
    }

    .project-link {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      opacity: 0.92;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .project-link:hover,
    .project-link:focus-visible {
      opacity: 1;
      transform: translateY(-1px);
      outline: none;
    }

    .brand {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 80px 24px;
    }

    .brand-title {
      margin: 0;
      width: 100%;
      text-align: center;
      font-size: clamp(38px, 8vw, 128px);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 0.9;
      text-transform: uppercase;
      text-shadow: 0 12px 60px rgba(0, 0, 0, 0.32);
    }

    @media (max-width: 600px) {
      .site-header {
        padding: max(24px, env(safe-area-inset-top)) 20px 24px;
      }

      .project-link {
        max-width: 42%;
        font-size: 10px;
        letter-spacing: 0.09em;
        line-height: 1.25;
      }

      .brand {
        padding: 72px 20px;
      }

      .brand-title {
        font-size: clamp(34px, 11vw, 64px);
      }

      body {
        background:
          radial-gradient(ellipse 125% 38% at 100% 100%, rgba(255, 106, 0, 0.62), transparent 72%),
          radial-gradient(ellipse 110% 32% at 0% 0%, rgba(255, 106, 0, 0.16), transparent 70%),
          linear-gradient(165deg, #030303 0%, #090605 52%, #180a03 82%, #050505 100%);
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <button class="project-link" type="button" onclick="showSoon()">
      Действующие проекты
    </button>

    <a class="project-link" href="https://lifegame.site/">
      Разрабатываемые проекты
    </a>
  </header>

  <main class="brand">
    <h1 class="brand-title">RAYMONDOVICH</h1>
  </main>

  <script>
    function showSoon() {
      alert("Скоро");
    }
  </script>
</body>
</html>
